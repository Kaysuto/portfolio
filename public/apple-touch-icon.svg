<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 180 180" height="180" width="180">
  <defs>
    <!-- Gradient pour la lettre K -->
    <linearGradient id="appleLetterK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#F0EBE3"/>
      <stop offset="70%" style="stop-color:#E6D3B7"/>
      <stop offset="100%" style="stop-color:#D4BE9F"/>
    </linearGradient>
    
    <!-- Gradient pour les accents -->
    <radialGradient id="appleAccentGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0EBE3" stop-opacity="0.9"/>
      <stop offset="70%" style="stop-color:#D4BE9F" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#B5A089" stop-opacity="0.3"/>
    </radialGradient>
    
    <!-- Filtre pour la lueur -->
    <filter id="appleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filtre pour l'ombre de la lettre -->
    <filter id="appleLetterShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Motif subtil de fond (transparent) -->
  <g opacity="0.1">
    <path d="M20,90 Q90,70 160,90" stroke="#D4BE9F" stroke-width="2" fill="none"/>
    <path d="M20,110 Q90,90 160,110" stroke="#B5A089" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Particules décoratives -->
  <g filter="url(#appleGlow)">
    <!-- Particules principales -->
    <circle cx="140" cy="40" r="6" fill="url(#appleAccentGradient)"/>
    <circle cx="40" cy="140" r="4" fill="url(#appleAccentGradient)"/>
    <circle cx="135" cy="135" r="3" fill="url(#appleAccentGradient)"/>
    
    <!-- Particules secondaires -->
    <circle cx="30" cy="45" r="2.5" fill="url(#appleAccentGradient)"/>
    <circle cx="45" cy="30" r="2" fill="url(#appleAccentGradient)"/>
    <circle cx="150" cy="50" r="1.5" fill="url(#appleAccentGradient)"/>
    
    <!-- Micro-particules -->
    <circle cx="25" cy="60" r="1" fill="url(#appleAccentGradient)"/>
    <circle cx="155" cy="125" r="1" fill="url(#appleAccentGradient)"/>
  </g>
  
  <!-- Lettre K principale -->
  <text x="90" y="115" text-anchor="middle" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="90" 
        font-weight="800" 
        fill="url(#appleLetterK)"
        filter="url(#appleLetterShadow)">
    K
  </text>
  
  <!-- Accents dans les coins -->
  <g opacity="0.4">
    <!-- Coin supérieur gauche -->
    <path d="M20,20 L35,20 M20,20 L20,35" stroke="#D4BE9F" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Coin inférieur droit -->
    <path d="M160,145 L145,145 M160,145 L160,130" stroke="#D4BE9F" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Point lumineux central subtil -->
  <circle cx="90" cy="90" r="2" fill="#F0EBE3" opacity="0.3"/>
</svg>