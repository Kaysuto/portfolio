<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1200 630" height="630" width="1200">
  <defs>
    <!-- Gradient de fond amélioré -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#140F0C"/>
      <stop offset="25%" style="stop-color:#241C17"/>
      <stop offset="75%" style="stop-color:#1A1310"/>
      <stop offset="100%" style="stop-color:#0F0B09"/>
    </linearGradient>
    
    <!-- Gradient pour les particules -->
    <radialGradient id="particleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFC27A" stop-opacity="0.8"/>
      <stop offset="50%" style="stop-color:#FBA541" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#C97A12" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Gradient pour le texte principal -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FEF7F2"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FEF7F2"/>
    </linearGradient>
    
    <!-- Gradient pour le sous-titre -->
    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FBA541"/>
      <stop offset="50%" style="stop-color:#FFC27A"/>
      <stop offset="100%" style="stop-color:#FBA541"/>
    </linearGradient>
    
    <!-- Filtre pour l'ombre -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre pour la lueur -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond principal -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Motif géométrique de fond -->
  <g opacity="0.1">
    <path d="M0,315 Q300,250 600,315 T1200,315" stroke="#D8CCC4" stroke-width="1" fill="none"/>
    <path d="M0,350 Q300,285 600,350 T1200,350" stroke="#B4A79F" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Particules améliorées avec différentes tailles -->
  <g filter="url(#glow)">
    <!-- Grandes particules -->
    <circle cx="150" cy="120" r="6" fill="url(#particleGradient)"/>
    <circle cx="1050" cy="150" r="8" fill="url(#particleGradient)"/>
    <circle cx="200" cy="480" r="5" fill="url(#particleGradient)"/>
    <circle cx="1000" cy="500" r="7" fill="url(#particleGradient)"/>
    
    <!-- Particules moyennes -->
    <circle cx="300" cy="180" r="4" fill="url(#particleGradient)"/>
    <circle cx="900" cy="200" r="4" fill="url(#particleGradient)"/>
    <circle cx="250" cy="400" r="3" fill="url(#particleGradient)"/>
    <circle cx="950" cy="420" r="3" fill="url(#particleGradient)"/>
    
    <!-- Petites particules -->
    <circle cx="100" cy="300" r="2" fill="url(#particleGradient)"/>
    <circle cx="1100" cy="320" r="2" fill="url(#particleGradient)"/>
    <circle cx="180" cy="250" r="1.5" fill="url(#particleGradient)"/>
    <circle cx="1020" cy="380" r="1.5" fill="url(#particleGradient)"/>
    <circle cx="80" cy="450" r="1" fill="url(#particleGradient)"/>
    <circle cx="1120" cy="280" r="1" fill="url(#particleGradient)"/>
  </g>
  
  <!-- Lignes décoratives supérieures -->
  <g opacity="0.6">
    <rect x="300" y="180" width="150" height="2" fill="#D8CCC4" rx="1"/>
    <rect x="750" y="180" width="150" height="2" fill="#D8CCC4" rx="1"/>
  </g>
  
  <!-- Nom principal avec effet -->
  <text x="600" y="280" text-anchor="middle" 
        font-family="Geist, ui-sans-serif, system-ui, sans-serif" 
        font-size="84" 
        font-weight="800" 
        fill="url(#titleGradient)"
        filter="url(#textShadow)">
    Kaysuto Kimiya
  </text>
  
  <!-- Sous-titre avec style amélioré -->
  <text x="600" y="340" text-anchor="middle" 
        font-family="Geist, ui-sans-serif, system-ui, sans-serif" 
        font-size="32" 
        font-weight="600" 
        fill="url(#subtitleGradient)"
        letter-spacing="2px">
    Product Builder
  </text>
  
  <!-- Description avec meilleure lisibilité -->
  <text x="600" y="400" text-anchor="middle" 
        font-family="Geist, ui-sans-serif, system-ui, sans-serif" 
        font-size="20" 
        font-weight="400" 
        fill="#ACA099"
        letter-spacing="0.5px">
    Expert en réseau • Développement • Pixel Art
  </text>
  
  <!-- Lignes décoratives centrales -->
  <g opacity="0.7">
    <rect x="350" y="440" width="100" height="2" fill="#D8CCC4" rx="1"/>
    <rect x="750" y="440" width="100" height="2" fill="#D8CCC4" rx="1"/>
    <!-- Élément central décoratif -->
    <circle cx="600" cy="441" r="4" fill="#D8CCC4"/>
  </g>
  
  <!-- Zone URL avec design moderne -->
  <g>
    <!-- Fond de la zone URL -->
    <rect x="420" y="480" width="360" height="50" rx="25" 
          fill="rgba(251, 165, 65, 0.10)" 
          stroke="rgba(251, 165, 65, 0.35)" 
          stroke-width="1"/>
    
    <!-- Texte URL -->
    <text x="600" y="510" text-anchor="middle" 
          font-family="Geist, ui-sans-serif, system-ui, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#FEF7F2"
          letter-spacing="0.5px">
      https://kaysuto.fr
    </text>
  </g>
  
  <!-- Lignes décoratives inférieures -->
  <g opacity="0.4">
    <rect x="150" y="570" width="200" height="1" fill="#B4A79F"/>
    <rect x="850" y="570" width="200" height="1" fill="#B4A79F"/>
  </g>
  
  <!-- Éléments décoratifs dans les coins -->
  <g opacity="0.3">
    <!-- Coin supérieur gauche -->
    <path d="M50,50 L100,50 M50,50 L50,100" stroke="#D8CCC4" stroke-width="2" stroke-linecap="round"/>
    <!-- Coin supérieur droit -->
    <path d="M1150,50 L1100,50 M1150,50 L1150,100" stroke="#D8CCC4" stroke-width="2" stroke-linecap="round"/>
    <!-- Coin inférieur gauche -->
    <path d="M50,580 L100,580 M50,580 L50,530" stroke="#D8CCC4" stroke-width="2" stroke-linecap="round"/>
    <!-- Coin inférieur droit -->
    <path d="M1150,580 L1100,580 M1150,580 L1150,530" stroke="#D8CCC4" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
