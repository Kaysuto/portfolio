<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient de fond cohérent avec le thème sombre -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B2F28"/>
      <stop offset="50%" style="stop-color:#2D221C"/>
      <stop offset="100%" style="stop-color:#3B2F28"/>
    </linearGradient>
    
    <!-- Gradient pour les particules -->
    <radialGradient id="particleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4BE9F" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#B5A089" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  
  <!-- Fond principal avec gradient -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Particules flottantes style cohérent -->
  <circle cx="120" cy="120" r="3" fill="url(#particleGradient)"/>
  <circle cx="1080" cy="480" r="4" fill="url(#particleGradient)"/>
  <circle cx="200" cy="350" r="2" fill="url(#particleGradient)"/>
  <circle cx="980" cy="180" r="3.5" fill="url(#particleGradient)"/>
  <circle cx="300" cy="500" r="2.5" fill="url(#particleGradient)"/>
  <circle cx="900" cy="380" r="2" fill="url(#particleGradient)"/>
  <circle cx="150" cy="480" r="1.5" fill="url(#particleGradient)"/>
  <circle cx="1050" cy="280" r="2.8" fill="url(#particleGradient)"/>
  
  <!-- Éléments décoratifs subtils -->
  <rect x="200" y="580" width="120" height="1" fill="#B5A089" opacity="0.4"/>
  <rect x="880" y="580" width="120" height="1" fill="#B5A089" opacity="0.4"/>
  
  <!-- Nom principal avec couleur foreground -->
  <text x="600" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#F0EBE3">
    Kimiya
  </text>
  
  <!-- Sous-titre avec couleur accent -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#D4BE9F">
    Full-Stack Maker
  </text>
  
  <!-- Description polyvalence avec couleur muted -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#B5A089">
    Expert en réseau • Développement • Pixel Art • Mini-jeux Minecraft
  </text>
  
  <!-- Séparateurs décoratifs -->
  <rect x="380" y="420" width="80" height="1" fill="#B5A089" opacity="0.6"/>
  <rect x="740" y="420" width="80" height="1" fill="#B5A089" opacity="0.6"/>
  
  <!-- URL du portfolio -->
  <text x="600" y="500" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#D4BE9F">
    kimiya-portfolio.vercel.app
  </text>
  
  <!-- Badge discret "100% Lighthouse" -->
  <rect x="480" y="540" width="240" height="30" rx="15" fill="#B5A089" opacity="0.2"/>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F0EBE3">
    🎯 LIGHTHOUSE 100%
  </text>
</svg>
