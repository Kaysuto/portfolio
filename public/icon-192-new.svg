<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B2F28"/>
      <stop offset="50%" style="stop-color:#2D221C"/>
      <stop offset="100%" style="stop-color:#3B2F28"/>
    </linearGradient>
    <linearGradient id="letter192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0EBE3"/>
      <stop offset="100%" style="stop-color:#D4BE9F"/>
    </linearGradient>
    <radialGradient id="accent192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4BE9F" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#B5A089" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  
  <!-- Fond principal -->
  <rect width="192" height="192" rx="36" fill="url(#bg192)"/>
  
  <!-- Particules décoratives -->
  <circle cx="40" cy="40" r="3" fill="url(#accent192)"/>
  <circle cx="152" cy="152" r="4" fill="url(#accent192)"/>
  <circle cx="152" cy="40" r="2" fill="url(#accent192)"/>
  <circle cx="40" cy="152" r="2.5" fill="url(#accent192)"/>
  
  <!-- Accent en bas -->
  <rect x="32" y="168" width="128" height="2" fill="#B5A089" opacity="0.5"/>
  
  <!-- Lettre K principale -->
  <text x="96" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#letter192)">
    K
  </text>
  
  <!-- Points décoratifs subtils -->
  <circle cx="96" cy="40" r="3" fill="#D4BE9F" opacity="0.6"/>
</svg>
