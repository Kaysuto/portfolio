<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 512 512" height="512" width="512">
  <defs>
    <!-- Gradient de fond amélioré -->
    <linearGradient id="icon512Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A1F1A"/>
      <stop offset="30%" style="stop-color:#3B2F28"/>
      <stop offset="70%" style="stop-color:#2D221C"/>
      <stop offset="100%" style="stop-color:#1F1611"/>
    </linearGradient>
    
    <!-- Gradient pour la lettre K -->
    <linearGradient id="icon512LetterK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#F0EBE3"/>
      <stop offset="70%" style="stop-color:#E6D3B7"/>
      <stop offset="100%" style="stop-color:#D4BE9F"/>
    </linearGradient>
    
    <!-- Gradient pour les accents -->
    <radialGradient id="icon512AccentGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0EBE3" stop-opacity="0.9"/>
      <stop offset="70%" style="stop-color:#D4BE9F" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#B5A089" stop-opacity="0.3"/>
    </radialGradient>
    
    <!-- Filtre pour la lueur -->
    <filter id="icon512Glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filtre pour l'ombre de la lettre -->
    <filter id="icon512LetterShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fond principal avec coins arrondis -->
  <rect width="512" height="512" rx="112" fill="url(#icon512Bg)"/>
  
  <!-- Motif subtil de fond -->
  <g opacity="0.1">
    <path d="M64,256 Q256,206 448,256" stroke="#D4BE9F" stroke-width="6" fill="none"/>
    <path d="M64,306 Q256,256 448,306" stroke="#B5A089" stroke-width="6" fill="none"/>
    <path d="M64,206 Q256,156 448,206" stroke="#C4B5A0" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Particules décoratives -->
  <g filter="url(#icon512Glow)">
    <!-- Particules principales -->
    <circle cx="396" cy="116" r="18" fill="url(#icon512AccentGradient)"/>
    <circle cx="116" cy="396" r="14" fill="url(#icon512AccentGradient)"/>
    <circle cx="384" cy="384" r="12" fill="url(#icon512AccentGradient)"/>
    
    <!-- Particules secondaires -->
    <circle cx="86" cy="128" r="10" fill="url(#icon512AccentGradient)"/>
    <circle cx="128" cy="86" r="8" fill="url(#icon512AccentGradient)"/>
    <circle cx="426" cy="138" r="6" fill="url(#icon512AccentGradient)"/>
    <circle cx="374" cy="138" r="5" fill="url(#icon512AccentGradient)"/>
    
    <!-- Micro-particules -->
    <circle cx="76" cy="172" r="4" fill="url(#icon512AccentGradient)"/>
    <circle cx="436" cy="342" r="4" fill="url(#icon512AccentGradient)"/>
    <circle cx="138" cy="436" r="3" fill="url(#icon512AccentGradient)"/>
    <circle cx="342" cy="76" r="3" fill="url(#icon512AccentGradient)"/>
    <circle cx="96" cy="316" r="2" fill="url(#icon512AccentGradient)"/>
    <circle cx="416" cy="196" r="2" fill="url(#icon512AccentGradient)"/>
  </g>
  
  <!-- Lettre K principale -->
  <text x="256" y="326" text-anchor="middle" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="256" 
        font-weight="800" 
        fill="url(#icon512LetterK)"
        filter="url(#icon512LetterShadow)">
    K
  </text>
  
  <!-- Accents dans les coins -->
  <g opacity="0.4">
    <!-- Coin supérieur gauche -->
    <path d="M64,64 L104,64 M64,64 L64,104" stroke="#D4BE9F" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Coin inférieur droit -->
    <path d="M448,408 L408,408 M448,408 L448,368" stroke="#D4BE9F" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Coin supérieur droit -->
    <path d="M448,104 L408,104 M448,104 L448,64" stroke="#B5A089" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Coin inférieur gauche -->
    <path d="M64,408 L104,408 M64,408 L64,368" stroke="#B5A089" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Points lumineux centraux -->
  <circle cx="256" cy="256" r="6" fill="#F0EBE3" opacity="0.3"/>
  <circle cx="256" cy="180" r="3" fill="#E6D3B7" opacity="0.2"/>
  <circle cx="256" cy="332" r="3" fill="#E6D3B7" opacity="0.2"/>
</svg>