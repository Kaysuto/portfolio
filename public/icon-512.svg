<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B2F28"/>
      <stop offset="50%" style="stop-color:#2D221C"/>
      <stop offset="100%" style="stop-color:#3B2F28"/>
    </linearGradient>
    <linearGradient id="letter512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0EBE3"/>
      <stop offset="100%" style="stop-color:#D4BE9F"/>
    </linearGradient>
    <radialGradient id="accent512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4BE9F" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#B5A089" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  
  <!-- Fond principal -->
  <rect width="512" height="512" rx="96" fill="url(#bg512)"/>
  
  <!-- Particules décoratives -->
  <circle cx="100" cy="100" r="8" fill="url(#accent512)"/>
  <circle cx="412" cy="412" r="10" fill="url(#accent512)"/>
  <circle cx="412" cy="100" r="6" fill="url(#accent512)"/>
  <circle cx="100" cy="412" r="7" fill="url(#accent512)"/>
  
  <!-- Accent en bas -->
  <rect x="80" y="450" width="352" height="4" fill="#B5A089" opacity="0.5"/>
  
  <!-- Lettre K principale -->
  <text x="256" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="256" font-weight="700" fill="url(#letter512)">
    K
  </text>
  
  <!-- Sous-texte subtil -->
  <text x="256" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#B5A089">
    Full-Stack Maker
  </text>
</svg>