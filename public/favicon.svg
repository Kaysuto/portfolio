<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32" height="32" width="32">
  <defs>
    <!-- Gradient pour la lettre K -->
    <linearGradient id="letterK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#F0EBE3"/>
      <stop offset="70%" style="stop-color:#E6D3B7"/>
      <stop offset="100%" style="stop-color:#D4BE9F"/>
    </linearGradient>
    
    <!-- Gradient pour les accents -->
    <radialGradient id="accentGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0EBE3" stop-opacity="0.9"/>
      <stop offset="70%" style="stop-color:#D4BE9F" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#B5A089" stop-opacity="0.3"/>
    </radialGradient>
    
    <!-- Filtre pour la lueur subtile -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filtre pour l'ombre de la lettre -->
    <filter id="letterShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Motif subtil de fond (sans rectangle de fond) -->
  <g opacity="0.1">
    <path d="M4,16 Q16,12 28,16" stroke="#D4BE9F" stroke-width="0.5" fill="none"/>
    <path d="M4,20 Q16,16 28,20" stroke="#B5A089" stroke-width="0.5" fill="none"/>
  </g>
  
  <!-- Particules décoratives -->
  <g filter="url(#subtleGlow)">
    <!-- Particule principale (coin supérieur droit) -->
    <circle cx="25" cy="7" r="1.2" fill="url(#accentGradient)"/>
    
    <!-- Particules secondaires -->
    <circle cx="7" cy="25" r="0.8" fill="url(#accentGradient)"/>
    <circle cx="24" cy="24" r="0.6" fill="url(#accentGradient)"/>
    
    <!-- Micro-particules -->
    <circle cx="6" cy="8" r="0.4" fill="url(#accentGradient)"/>
    <circle cx="8" cy="6" r="0.3" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Lettre K principale -->
  <text x="16" y="23" text-anchor="middle" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="18" 
        font-weight="800" 
        fill="url(#letterK)"
        filter="url(#letterShadow)">
    K
  </text>
  
  <!-- Accents dans les coins -->
  <g opacity="0.4">
    <!-- Coin supérieur gauche -->
    <path d="M4,4 L7,4 M4,4 L4,7" stroke="#D4BE9F" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Coin inférieur droit -->
    <path d="M28,26 L25,26 M28,26 L28,23" stroke="#D4BE9F" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Point lumineux central subtil -->
  <circle cx="16" cy="16" r="0.5" fill="#F0EBE3" opacity="0.3"/>
</svg>
