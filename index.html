    <!-- CSS critique inline : évite le flash de couleur avant le chargement de index.css.
         Les valeurs doivent rester alignées sur --background / --foreground de src/index.css. -->
    <style>
        html{font-family:'Instrument Sans Variable',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;scroll-behavior:smooth;background:#F4ECDC}
        html.dark{background:#221A14}
        body{margin:0;background:#F4ECDC;color:#2A2018;line-height:1.6}
        html.dark body{background:#221A14;color:#EFE5D3}
        #root{min-height:100vh}
        *{box-sizing:border-box}
    </style>
    
        <script>
                // Applique le thème avant le rendu (évite FOUC) - Version optimisée
                (function() {
                    try {
                        // Vérifier d'abord localStorage, puis les cookies
                        var theme = localStorage.getItem('theme');
                        if (!theme) {
                            var match = document.cookie.match(/(?:^|; )theme=(dark|light)(?:;|$)/);
                            theme = match ? match[1] : 'dark';
                        }
                        // Appliquer immédiatement la classe dark au html
                        var htmlEl = document.documentElement;
                        if (theme === 'dark') {
                            htmlEl.classList.add('dark');
                        } else {
                            htmlEl.classList.remove('dark');
                        }
                        // Synchroniser avec le body pour éviter le flash
                        htmlEl.style.colorScheme = theme;
                    } catch(e) {
                        // Fallback au thème sombre par défaut
                        document.documentElement.classList.add('dark');
                        document.documentElement.style.colorScheme = 'dark';
                    }
                })();
                
                // Service Worker registration optimisé
                if ('serviceWorker' in navigator && location.protocol === 'https:') {
                    if ('requestIdleCallback' in window) {
                        requestIdleCallback(function() {
                            navigator.serviceWorker.register('/sw.js').catch(function() {});
                        });
                    } else {
                        setTimeout(function() {
                            navigator.serviceWorker.register('/sw.js').catch(function() {});
                        }, 1000);
                    }
                }
        </script>
