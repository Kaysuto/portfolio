        <script>
                // Applique le thème avant le rendu (évite FOUC)
                (function() {
                    try {
                        // Vérifier d'abord localStorage, puis les cookies
                        var theme = localStorage.getItem('theme');
                        if (!theme) {
                            var match = document.cookie.match(/(?:^|; )theme=(dark|light)(?:;|$)/);
                            theme = match ? match[1] : 'dark';
                        }
                        if (theme === 'dark') {
                            document.documentElement.classList.add('dark');
                        } else {
                            document.documentElement.classList.remove('dark');
                        }
                    } catch(e) {
                        // Fallback au thème sombre par défaut
                        document.documentElement.classList.add('dark');
                    }
                })();
                // Preload critical resources
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(function() {
                        // Précharger les ressources critiques au lieu des fichiers source
                        var link = document.createElement('link');
                        link.rel = 'prefetch';
                        link.href = '/assets/index-BTCAK2Ao.js';
                        document.head.appendChild(link);
                    });
                }
        </script>
