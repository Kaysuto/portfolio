# Configuration des headers de cache pour optimisation Lighthouse
# À utiliser avec nginx, Apache, ou tout serveur web

# Ressources statiques - Cache agressif (1 an)
# JavaScript, CSS, Images, Fonts
/assets/*.js
/assets/*.css
/assets/*.woff2
/assets/*.woff
/assets/*.png
/assets/*.jpg
/assets/*.jpeg
/assets/*.gif
/assets/*.svg
/assets/*.ico
  Cache-Control: public, max-age=31536000, immutable
  # 1 an = 31536000 secondes

# Ressources externes optimisées
/fonts.googleapis.com/css2*
  Cache-Control: public, max-age=86400
  # 1 jour = 86400 secondes

/fonts.gstatic.com/s/*
  Cache-Control: public, max-age=31536000, immutable
  # 1 an pour les fonts

# API et données dynamiques - Cache court
/api/*
  Cache-Control: public, max-age=300
  # 5 minutes = 300 secondes

# HTML - Cache court pour permettre les mises à jour
/*
  Cache-Control: public, max-age=3600
  # 1 heure = 3600 secondes

# Service Worker - Pas de cache pour permettre les mises à jour
/sw.js
  Cache-Control: no-cache, no-store, must-revalidate
  # Toujours vérifier la fraîcheur

# Manifest PWA
/manifest.json
  Cache-Control: public, max-age=86400
  # 1 jour

# Robots et sitemaps
/robots.txt
/sitemap.xml
  Cache-Control: public, max-age=86400
  # 1 jour
